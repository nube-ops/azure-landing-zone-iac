name: Azure Landing Zone Deployment

on:
  workflow_dispatch:
# pull_request:
  #   branches: [ main ]
# push:
  #   branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bicep Files
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Pre-install/version lock Bicep with retry logic to handle transient container network drops
            RETRY=0
            UNTIL=3
            until [ $RETRY -ge $UNTIL ]
            do
              az bicep install && break
              RETRY=$((RETRY+1))
              echo "Bicep CLI installation failed. Retrying ($RETRY/$UNTIL) in 5s..."
              sleep 5
            done

            # Execute validation against static orchestration template
            az bicep build --file environments/prod/main.bicep
            az bicep lint --file environments/prod/main.bicep

  what-if:
    name: Tenant What-If Dry Run (${{ matrix.environment }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    
    # Scalability: Matrix strategy allows this single job to handle 
    # multiple environments (prod, dev, staging) without duplicating YAML code.
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: Dev environment temporarily disabled to conserve Pay-As-You-Go subscription limits.
          # To re-enable dev validation/what-if runs, uncomment the lines below:
          #- environment: dev
          #  location: centralus
          #  mode: what-if
          - environment: prod
            location: centralus
            mode: deploy

    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TENANT_ROOT_MANAGEMENT_GROUP_ID: ${{ secrets.TENANT_ROOT_MANAGEMENT_GROUP_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Parameter File from Template
        run: |
          # Dynamically copies the scrubbed public template into the active parameter filename for Bicep
          cp environments/${{ matrix.environment }}/main.bicepparam.example environments/${{ matrix.environment }}/main.bicepparam
          sed -i "s/11111111-1111-1111-1111-111111111111/${{ secrets.CORP_SUB_ID }}/g" environments/${{ matrix.environment }}/main.bicepparam
          sed -i "s/22222222-2222-2222-2222-222222222222/${{ secrets.ONLINE_SUB_ID }}/g" environments/${{ matrix.environment }}/main.bicepparam
          sed -i "s/33333333-3333-3333-3333-333333333333/${{ secrets.CONNECTIVITY_SUB_ID }}/g" environments/${{ matrix.environment }}/main.bicepparam
          sed -i "s/44444444-4444-4444-4444-444444444444/${{ secrets.IDENTITY_SUB_ID }}/g" environments/${{ matrix.environment }}/main.bicepparam
          sed -i "s/55555555-5555-5555-5555-555555555555/${{ secrets.MANAGEMENT_SUB_ID }}/g" environments/${{ matrix.environment }}/main.bicepparam

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Generic Multi-Scope Context Warmup
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "=== Starting Generic OIDC Token Context Warmup ==="
            
            # 1. Dynamically retrieve all subscription IDs accessible to the OIDC principal
            SUBS=$(az account list --query "[].id" -o tsv)
            
            # 2. Iterate and pre-warm access tokens across all scoped environments
            for SUB_ID in $SUBS; do
              echo "Pre-warming ARM access token cache for target subscription: $SUB_ID"
              
              # Poll target subscription scope up to 5 times with dynamic backoff
              RETRY_COUNT=0
              MAX_RETRIES=5
              SUCCESS=false
              
              until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ "$SUCCESS" = true ]; do
                if az account set --subscription "$SUB_ID" --output none 2>/dev/null; then
                  SUCCESS=true
                  echo "Successfully established context for $SUB_ID"
                else
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  echo "Token replication pending for $SUB_ID. Retry $RETRY_COUNT/$MAX_RETRIES in 3s..."
                  sleep 3
                fi
              done
            done

            echo "=== Token Context Warmup Complete ==="
          
      - name: Run Tenant What-If Dry Run (Dev Environment)
        if: matrix.mode == 'what-if'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment tenant what-if \
              --location ${{ matrix.location }} \
              --template-file environments/${{ matrix.environment }}/main.bicep \
              --parameters environments/${{ matrix.environment }}/main.bicepparam

      - name: Run Tenant Enterprise Deployment (Prod Environment)
        if: matrix.mode == 'deploy'
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "=== Executing Tenant-Level Governance Deployment ==="
            az deployment tenant create \
              --location ${{ matrix.location }} \
              --template-file environments/${{ matrix.environment }}/main.bicep \
              --parameters environments/${{ matrix.environment }}/main.bicepparam

            echo "=== Executing Subscription-Level Connectivity Deployment ==="
            
            # Dynamically query platform-teams.json for the networking team metadata
            CONFIG_FILE="environments/${{ matrix.environment }}/platform-teams.json"
            NET_OWNER=$(jq -r '.platformTeams[] | select(.targetSubscriptionWorkload == "connectivity") | .name' "$CONFIG_FILE")
            NET_COST_CENTER=$(jq -r '.platformTeams[] | select(.targetSubscriptionWorkload == "connectivity") | .costCenter' "$CONFIG_FILE")

            echo "Extracted from JSON -> Owner: $NET_OWNER, CostCenter: $NET_COST_CENTER"

            az deployment sub create \
              --location ${{ matrix.location }} \
              --subscription ${{ secrets.CONNECTIVITY_SUB_ID }} \
              --template-file environments/${{ matrix.environment }}/connectivity.bicep \
              --parameters orgName="contoso" environment="${{ matrix.environment }}" owner="$NET_OWNER" costCenter="$NET_COST_CENTER"