name: Azure Landing Zone Deployment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: a446683b-9732-45a3-aa99-167c1a62e7bf
          tenant-id: eb3308e2-722e-44f9-99d6-c0f4ca5af1eb
          allow-no-subscriptions: true

      - name: Run Tenant What-If Dry Run
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az deployment tenant what-if \
              --location centralus \
              --template-file live/prod/main.bicep \
              --parameters live/prod/main.bicepparam