name: Azure Landing Zone Deployment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bicep Files
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file environments/prod/main.bicep
            az bicep lint --file environments/prod/main.bicep

  what-if:
    name: Tenant What-If Dry Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: contoso-production
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TENANT_ROOT_MANAGEMENT_GROUP_ID: ${{ secrets.TENANT_ROOT_MANAGEMENT_GROUP_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run Tenant What-If Dry Run
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment tenant what-if \
              --location centralus \
              --template-file environments/prod/main.bicep \
              --parameters environments/prod/main.bicepparam